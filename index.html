<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор дохода курьера</title>

<style>

body {
    margin:0;
    font-family: Arial;
    background-image: url("https://images.unsplash.com/photo-1502877338535-766e1452684a?auto=format&fit=crop&w=1600&q=80");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color:white;
}

body::before {
    content:"";
    position:fixed;
    inset:0;
    background: rgba(0,0,0,0.55);
}

.wrapper {
    max-width:900px;
    margin:20px auto;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    padding:15px;
}

.container, .sidebar {
    flex:1;
    min-width:300px;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(12px);
    border-radius:16px;
    padding:20px;
    border:1px solid rgba(255,255,255,0.15);
}

h1 {
    font-size:20px;
    text-align:center;
}

label {
    display:block;
    margin-top:12px;
    font-weight:bold;
}

input[type=range] {
    width:100%;
    accent-color:#00e676;
}

select {
    width:100%;
    padding:10px;
    border-radius:10px;
    margin-top:5px;
}

.result {
    margin-top:15px;
    padding:15px;
    background: rgba(0,0,0,0.3);
    border-radius:12px;
    text-align:center;
}

.counter {
    font-size:20px;
    font-weight:bold;
    margin:6px 0;
}

button {
    width:100%;
    margin-top:15px;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#00c853;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.small {
    font-size:13px;
    opacity:0.85;
}

/* цель */
.goalBox {
    margin-top:10px;
    padding:12px;
    border-radius:12px;
    background: rgba(0,0,0,0.35);
    display:none;
}

.goalTitle {
    font-size:26px;
    font-weight:bold;
    margin-bottom:8px;
}

.goalBtn {
    width:100%;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    border:none;
    background:rgba(255,255,255,0.15);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="wrapper">

<!-- КАЛЬКУЛЯТОР -->
<div class="container">

<h1>💰 Твой возможный доход курьером в Яндекс.Еде</h1>

<label>Сколько часов в день ты хочешь работать?</label>
<input id="hours" type="range" min="1" max="12" value="7">

<label>Сколько дней в неделю планируешь работать?</label>
<input id="days" type="range" min="1" max="7" value="3">

<label>На чём будешь доставлять заказы?</label>
<select id="type">
<option value="auto">🚗 Авто</option>
<option value="bike">🚴 Вело</option>
<option value="ped">🚶 Пеший</option>
</select>

<div class="result">

<div>За день</div>
<div class="counter" id="day">0 ₽</div>

<div>За неделю</div>
<div class="counter" id="week">0 ₽</div>

<div>За месяц</div>
<div class="counter" id="month">0 ₽</div>

<button onclick="go()">🚀 Начать сейчас</button>

</div>

</div>

<!-- БОНУС + ЦЕЛЬ -->
<div class="sidebar">

<h2>🎁 Приведи друга</h2>

<p class="small">+20 000 ₽ за каждого приглашённого друга</p>

<label>
<input type="checkbox" id="bonus"> Участвую в бонусе
</label>

<label>Сколько друзей пригласишь?</label>
<input id="friends" type="range" min="0" max="10" value="0">
<div id="friendsOut">0</div>

<!-- КНОПКА ЦЕЛИ -->
<button class="goalBtn" onclick="toggleGoal()">
🎯 На что хватит этих денег?
</button>

<!-- РАСКРЫВАЮЩИЙСЯ БЛОК -->
<div id="goalBox" class="goalBox"></div>

</div>

</div>

<script>

const link =
"https://reg.eda.yandex.ru/?advertisement_campaign=forms_for_agents&user_invite_code=2ec40a49329f4a75ba7687a9e5ff3c0d&utm_content=blank";

const rates = {
    ped:[330,340],
    bike:[410,420],
    auto:[510,520]
};

function rand(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
}

let userRate = {
    ped: rand(...rates.ped),
    bike: rand(...rates.bike),
    auto: rand(...rates.auto)
};

const goals = [
{ name:"🎧 Наушники", price:5000 },
{ name:"👕 Одежда", price:8000 },
{ name:"📱 Смартфон", price:25000 },
{ name:"🚲 Велосипед", price:35000 },
{ name:"💻 Ноутбук", price:70000 },
{ name:"🌊 В Питер на выходные", price:30000 },
{ name:"🏖️ Отпуск", price:80000 }
];

const h = document.getElementById("hours");
const d = document.getElementById("days");
const t = document.getElementById("type");

h.oninput = d.oninput = t.onchange = calc;

function calc(){

let hours = +h.value;
let days = +d.value;
let type = t.value;

let hourly = userRate[type];

let day = hourly * hours;
let week = day * days;
let month = week * 4.3;

document.getElementById("day").innerText =
Math.round(day).toLocaleString()+" ₽";

document.getElementById("week").innerText =
Math.round(week).toLocaleString()+" ₽";

document.getElementById("month").innerText =
Math.round(month).toLocaleString()+" ₽";

window.currentMonth = month;

}

function toggleGoal(){

let box = document.getElementById("goalBox");

if(box.style.display === "block"){
box.style.display = "none";
return;
}

box.style.display = "block";

renderGoal(window.currentMonth || 0);
}

function renderGoal(month){

let filtered = goals.filter(g => g.price <= month * 3);

if(filtered.length === 0){
document.getElementById("goalBox").innerHTML = "";
return;
}

let goal = filtered[Math.floor(Math.random() * filtered.length)];

let save = month / 3;
let time = goal.price / save;

document.getElementById("goalBox").innerHTML =

`<div class="goalTitle">🎯 ${goal.name}</div>
<div class="small">
Стоимость: ${goal.price.toLocaleString()} ₽<br><br>
Если откладывать 1/3 дохода:<br>
≈ ${time.toFixed(1)} мес. до цели
</div>`;
}

function go(){
window.open(link,"_blank");
}

calc();

</script>

</body>
</html>
